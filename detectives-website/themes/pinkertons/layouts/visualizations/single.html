{{ define "main" }}
<section class="py-16 px-6">
  <div class="container mx-auto">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="mb-12">
        <h1 class="text-4xl md:text-5xl font-heading font-bold text-grit-text-dark mb-4">{{ .Title }}</h1>
        {{ if .Params.description }}
        <p class="text-xl text-grit-text-dark/80 leading-relaxed">{{ .Params.description }}</p>
        {{ end }}
      </div>

      <!-- Per-investigation charts rendered here -->
      <div id="visualization-container">
        <div role="status" aria-live="polite" class="flex items-center justify-center py-24 text-grit-text-dark/60">
          <p>Loading visualizations...</p>
        </div>
      </div>

      <!-- Analysis Content -->
      {{ if .Content }}
      <div class="prose prose-lg max-w-none mt-12">
        {{ .Content }}
      </div>
      {{ end }}

    </div>
  </div>
</section>

<script type="module">
  import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

  const vizType = '{{ .Params.vizType }}';

  const INVESTIGATIONS = {
    'el-paso':  'El Paso Smelter Fraud',
    'nyc':      'Robbery of the Corn Exchange Bank',
    'hobart':   'Murder of William Hobart',
    'atlanta':  'Atlanta Laundry Thefts',
  };

  const ACCENT = "#b5381e";

  function countBy(data, field) {
    const counts = {};
    data.forEach(d => {
      const val = d[field];
      if (val != null && val !== "") {
        counts[val] = (counts[val] || 0) + 1;
      }
    });
    return Object.entries(counts)
      .map(([value, count]) => ({ value, count }))
      .sort((a, b) => b.count - a.count);
  }

  function chartWidth() {
    return Math.min(800, window.innerWidth - 100);
  }

  // Builds a collapsible <table> as a non-visual equivalent to a chart, so the
  // underlying data is available to screen reader / keyboard users without
  // relying on the chart's pointer-only tooltips.
  function dataTable(rows, columns) {
    const details = document.createElement('details');
    details.className = 'mt-3';

    const summary = document.createElement('summary');
    summary.className = 'text-sm text-grit-accent cursor-pointer hover:underline';
    summary.textContent = 'View data as table';
    details.appendChild(summary);

    const wrap = document.createElement('div');
    wrap.className = 'overflow-x-auto mt-2';
    const table = document.createElement('table');
    table.className = 'w-full text-left text-sm';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    columns.forEach(col => {
      const th = document.createElement('th');
      th.className = 'px-3 py-2 font-semibold text-gray-600 border-b-2 border-gray-300 bg-gray-50';
      th.textContent = col.label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.className = 'border-b border-gray-200';
      columns.forEach(col => {
        const td = document.createElement('td');
        td.className = 'px-3 py-2';
        td.textContent = row[col.key];
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    wrap.appendChild(table);
    details.appendChild(wrap);
    return details;
  }

  // Wraps a Plot chart with role="img"/aria-label and an appended data table.
  function chartWithTable(chart, ariaLabel, tableRows, tableColumns) {
    const wrapper = document.createElement('div');
    chart.setAttribute('role', 'img');
    chart.setAttribute('aria-label', ariaLabel);
    wrapper.appendChild(chart);
    wrapper.appendChild(dataTable(tableRows, tableColumns));
    return wrapper;
  }

  // Chart renderers per viz type
  const renderers = {
    'activity-types': (data) => {
      const counts = countBy(data, 'activity').slice(0, 12);
      if (counts.length === 0) return null;
      const chart = Plot.plot({
        marginLeft: 140, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
      return chartWithTable(
        chart,
        `Bar chart of activity type counts (${counts.length} types)`,
        counts.map(c => ({ Activity: c.value, Count: c.count })),
        [{ key: 'Activity', label: 'Activity' }, { key: 'Count', label: 'Count' }]
      );
    },

    'daily-activity': (data) => {
      const withDates = data.filter(d => d.date).map(d => ({
        ...d,
        dateObj: new Date(d.date.substring(0, 10)),
        activityType: d.activity_type || d.activity || "Unknown"
      }));
      if (withDates.length === 0) return null;
      const activityTypes = [...new Set(withDates.map(d => d.activityType))].sort();
      const ACTIVITY_COLORS = {
        "Surveillance": "#b5381e", "Shadowing": "#c8a04a", "Interview": "#5d7a6b",
        "Contact": "#6b7280", "Search": "#7c3aed", "Informant": "#0369a1", "Roping": "#d97706",
      };
      const chart = Plot.plot({
        marginLeft: 50, marginBottom: 60,
        width: chartWidth(), height: 250,
        x: { type: "time", label: "Date", tickFormat: "%b %d", tickRotate: -30 },
        y: { grid: true, label: "Activities" },
        color: {
          domain: activityTypes,
          range: activityTypes.map(t => ACTIVITY_COLORS[t] || "#999"),
          legend: true
        },
        marks: [
          Plot.rectY(withDates, Plot.binX({ y: "count" }, { x: "dateObj", interval: "day", fill: "activityType", tip: true })),
          Plot.ruleY([0]),
        ],
      });

      // Build a "Date, Activity type, Count" table matching the day-by-type bins in the chart
      const dayTypeCounts = {};
      withDates.forEach(d => {
        const day = d.dateObj.toISOString().substring(0, 10);
        const key = `${day}|${d.activityType}`;
        dayTypeCounts[key] = (dayTypeCounts[key] || 0) + 1;
      });
      const rows = Object.entries(dayTypeCounts)
        .map(([key, count]) => {
          const [date, type] = key.split('|');
          return { Date: date, 'Activity type': type, Count: count };
        })
        .sort((a, b) => a.Date.localeCompare(b.Date) || a['Activity type'].localeCompare(b['Activity type']));

      return chartWithTable(
        chart,
        `Histogram of daily activity counts by activity type (${activityTypes.length} types)`,
        rows,
        [{ key: 'Date', label: 'Date' }, { key: 'Activity type', label: 'Activity type' }, { key: 'Count', label: 'Count' }]
      );
    },

    'location-types': (data) => {
      const types = [];
      data.forEach(d => {
        if (d.locations && d.locations.length > 0) {
          const t = d.locations[0].location_type;
          if (t) types.push(t);
        }
      });
      const counts = {};
      types.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
      const sorted = Object.entries(counts).map(([value, count]) => ({ value, count })).sort((a, b) => b.count - a.count).slice(0, 15);
      if (sorted.length === 0) return null;
      const chart = Plot.plot({
        marginLeft: 160, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, sorted.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(sorted, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
      return chartWithTable(
        chart,
        `Bar chart of location type counts (${sorted.length} types)`,
        sorted.map(c => ({ 'Location type': c.value, Count: c.count })),
        [{ key: 'Location type', label: 'Location type' }, { key: 'Count', label: 'Count' }]
      );
    },

    'workload': (data) => {
      const counts = countBy(data, 'operative').slice(0, 15);
      if (counts.length === 0) return null;
      const chart = Plot.plot({
        marginLeft: 160, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
      return chartWithTable(
        chart,
        `Bar chart of operative workload counts (${counts.length} operatives)`,
        counts.map(c => ({ Operative: c.value, Count: c.count })),
        [{ key: 'Operative', label: 'Operative' }, { key: 'Count', label: 'Count' }]
      );
    },

    'top-subjects': (data) => {
      const counts = countBy(data, 'subject').slice(0, 15);
      if (counts.length === 0) return null;
      const chart = Plot.plot({
        marginLeft: 180, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
      return chartWithTable(
        chart,
        `Bar chart of top subjects watched (${counts.length} subjects)`,
        counts.map(c => ({ Subject: c.value, Count: c.count })),
        [{ key: 'Subject', label: 'Subject' }, { key: 'Count', label: 'Count' }]
      );
    },
  };

  async function renderAll() {
    const container = document.getElementById('visualization-container');

    try {
      const allData = await window.fetchPinkertonActivities();

      container.innerHTML = '';

      // Try loading a JS module first (for advanced viz types with their own layout)
      try {
        const mod = await import(`/js/visualizations/${vizType}.js`);
        if (mod.createVisualization) {
          const el = await mod.createVisualization(allData);
          if (el) container.appendChild(el);
          return;
        }
      } catch (e) {
        // No module found, fall through to inline renderers
      }

      const renderer = renderers[vizType];
      if (!renderer) {
        container.innerHTML = `<p role="alert" class="text-grit-accent p-8 text-center">Unknown visualization type: ${vizType}</p>`;
        return;
      }

      for (const [key, label] of Object.entries(INVESTIGATIONS)) {
        const invData = allData.filter(d => d.investigation === key);
        if (invData.length === 0) continue;

        // Section card
        const card = document.createElement('div');
        card.className = 'bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm';

        const heading = document.createElement('h2');
        heading.className = 'text-2xl font-heading font-bold text-grit-text-dark mb-1';
        heading.textContent = label;
        card.appendChild(heading);

        const subtitle = document.createElement('p');
        subtitle.className = 'text-sm text-grit-text-dark/60 mb-4';
        subtitle.textContent = `${invData.length} activities`;
        card.appendChild(subtitle);

        const chartEl = renderer(invData);
        if (chartEl) {
          card.appendChild(chartEl);
        } else {
          const empty = document.createElement('p');
          empty.className = 'text-grit-text-dark/60 text-sm';
          empty.textContent = 'No data available for this investigation.';
          card.appendChild(empty);
        }

        container.appendChild(card);
      }
    } catch (err) {
      console.error('Visualization error:', err);
      container.innerHTML = `<p role="alert" class="text-grit-accent p-8 text-center">Error loading data: ${err.message}</p>`;
    }
  }

  renderAll();
</script>
{{ end }}
