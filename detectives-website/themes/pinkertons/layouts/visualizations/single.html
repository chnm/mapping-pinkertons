{{ define "main" }}
<section class="py-16 px-6">
  <div class="container mx-auto">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="mb-12">
        <h1 class="text-4xl md:text-5xl font-heading font-bold text-grit-text-dark mb-4">{{ .Title }}</h1>
        {{ if .Params.description }}
        <p class="text-xl text-grit-text-dark/80 leading-relaxed">{{ .Params.description }}</p>
        {{ end }}
      </div>

      <!-- Per-investigation charts rendered here -->
      <div id="visualization-container">
        <div class="flex items-center justify-center py-24 text-grit-text-dark/60">
          <p>Loading visualizations...</p>
        </div>
      </div>

      <!-- Analysis Content -->
      {{ if .Content }}
      <div class="prose prose-lg max-w-none mt-12">
        {{ .Content }}
      </div>
      {{ end }}

    </div>
  </div>
</section>

<script type="module">
  import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

  const vizType = '{{ .Params.vizType }}';

  const INVESTIGATIONS = {
    'el-paso':  'El Paso Labor Disputes',
    'nyc':      'Robbery of the Corn Exchange Bank',
    'hobart':   'Murder of William Hobart',
    'atlanta':  'Atlanta Laundry Thefts',
  };

  const ACCENT = "#b5381e";

  function countBy(data, field) {
    const counts = {};
    data.forEach(d => {
      const val = d[field];
      if (val != null && val !== "") {
        counts[val] = (counts[val] || 0) + 1;
      }
    });
    return Object.entries(counts)
      .map(([value, count]) => ({ value, count }))
      .sort((a, b) => b.count - a.count);
  }

  function chartWidth() {
    return Math.min(800, window.innerWidth - 100);
  }

  // Chart renderers per viz type
  const renderers = {
    'activity-types': (data) => {
      const counts = countBy(data, 'activity').slice(0, 12);
      if (counts.length === 0) return null;
      return Plot.plot({
        marginLeft: 140, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
    },

    'daily-activity': (data) => {
      const withDates = data.filter(d => d.date).map(d => ({ ...d, dateObj: new Date(d.date.substring(0, 10)) }));
      if (withDates.length === 0) return null;
      return Plot.plot({
        marginLeft: 50, marginBottom: 60,
        width: chartWidth(), height: 250,
        x: { type: "time", label: "Date", tickFormat: "%b %Y", tickRotate: -30 },
        y: { grid: true, label: "Activities" },
        marks: [
          Plot.rectY(withDates, Plot.binX({ y: "count" }, { x: "dateObj", interval: "month", fill: ACCENT, tip: true })),
          Plot.ruleY([0]),
        ],
      });
    },

    'location-types': (data) => {
      const types = [];
      data.forEach(d => {
        if (d.locations && d.locations.length > 0) {
          const t = d.locations[0].location_type;
          if (t) types.push(t);
        }
      });
      const counts = {};
      types.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
      const sorted = Object.entries(counts).map(([value, count]) => ({ value, count })).sort((a, b) => b.count - a.count).slice(0, 15);
      if (sorted.length === 0) return null;
      return Plot.plot({
        marginLeft: 160, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, sorted.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(sorted, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
    },

    'workload': (data) => {
      const counts = countBy(data, 'operative').slice(0, 15);
      if (counts.length === 0) return null;
      return Plot.plot({
        marginLeft: 160, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
    },

    'top-subjects': (data) => {
      const counts = countBy(data, 'subject').slice(0, 15);
      if (counts.length === 0) return null;
      return Plot.plot({
        marginLeft: 180, marginBottom: 40,
        width: chartWidth(), height: Math.max(180, counts.length * 30 + 60),
        x: { grid: true, label: "Activities" },
        y: { label: null },
        marks: [
          Plot.barX(counts, { x: "count", y: "value", fill: ACCENT, sort: { y: "-x" }, tip: true }),
          Plot.ruleX([0]),
        ],
      });
    },
  };

  async function renderAll() {
    const container = document.getElementById('visualization-container');

    try {
      const response = await fetch('https://data.chnm.org/pinkertons/activities');
      if (!response.ok) throw new Error('Failed to fetch data');
      const allData = await response.json();

      container.innerHTML = '';

      // Try loading a JS module first (for advanced viz types with their own layout)
      try {
        const mod = await import(`/js/visualizations/${vizType}.js`);
        if (mod.createVisualization) {
          const el = await mod.createVisualization(allData);
          if (el) container.appendChild(el);
          return;
        }
      } catch (e) {
        // No module found, fall through to inline renderers
      }

      const renderer = renderers[vizType];
      if (!renderer) {
        container.innerHTML = `<p class="text-grit-accent p-8 text-center">Unknown visualization type: ${vizType}</p>`;
        return;
      }

      for (const [key, label] of Object.entries(INVESTIGATIONS)) {
        const invData = allData.filter(d => d.investigation === key);
        if (invData.length === 0) continue;

        // Section card
        const card = document.createElement('div');
        card.className = 'bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm';

        const heading = document.createElement('h2');
        heading.className = 'text-2xl font-heading font-bold text-grit-text-dark mb-1';
        heading.textContent = label;
        card.appendChild(heading);

        const subtitle = document.createElement('p');
        subtitle.className = 'text-sm text-grit-text-dark/60 mb-4';
        subtitle.textContent = `${invData.length} activities`;
        card.appendChild(subtitle);

        const chartEl = renderer(invData);
        if (chartEl) {
          card.appendChild(chartEl);
        } else {
          const empty = document.createElement('p');
          empty.className = 'text-grit-text-dark/60 text-sm';
          empty.textContent = 'No data available for this investigation.';
          card.appendChild(empty);
        }

        container.appendChild(card);
      }
    } catch (err) {
      console.error('Visualization error:', err);
      container.innerHTML = `<p class="text-grit-accent p-8 text-center">Error loading data: ${err.message}</p>`;
    }
  }

  renderAll();
</script>
{{ end }}
