{{ define "main" }}
<section class="py-16 px-6">
  <div class="container mx-auto">
    <div class="max-w-screen-xl mx-auto">

      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-4xl md:text-5xl font-heading font-bold text-grit-text-dark mb-4">{{ .Title }}</h1>
        {{ if .Params.description }}
        <p class="text-xl text-grit-text-dark/80 leading-relaxed">{{ .Params.description }}</p>
        {{ end }}
      </div>

      <!-- Prose instructions -->
      {{ if .Content }}
      <div class="prose prose-lg max-w-none mb-8">
        {{ .Content }}
      </div>
      {{ end }}

      <!-- Dashboard container (JS builds content here) -->
      <div id="dashboard-container">
        <div id="dashboard-loading" role="status" aria-live="polite" class="flex flex-col items-center justify-center py-24 text-grit-text-dark/60">
          <svg id="dashboard-spinner" width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Loading">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.25"></circle>
            <path fill="currentColor" opacity="0.75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <p class="mt-4 text-lg">Loading dashboard data…</p>
        </div>
      </div>


    </div>
  </div>
</section>

<!-- Leaflet for dashboard map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<style>
  @keyframes dashboard-spin {
    to { transform: rotate(360deg); }
  }
  #dashboard-spinner {
    animation: dashboard-spin 1s linear infinite;
    color: #b5381e;
  }
  .dashboard-map-tooltip {
    font-size: 0.8rem;
    line-height: 1.4;
  }
  #dashboard-map .leaflet-top,
  #dashboard-map .leaflet-bottom {
    z-index: 0 !important;
  }
  #dashboard-map .leaflet-pane {
    z-index: 0 !important;
  }
</style>

<script type="module">
  async function loadDashboard() {
    const container = document.getElementById('dashboard-container');
    const loading = document.getElementById('dashboard-loading');
    try {
      const data = await window.fetchPinkertonActivities();
      loading.remove();
      const mod = await import('/js/visualizations/dashboard.js');
      const el = await mod.createVisualization(data, { deferRender: true });
      if (el) {
        container.appendChild(el);
        // Trigger initial render now that the element is in the DOM
        el.dispatchEvent(new CustomEvent('dashboard:mounted'));
      }
    } catch (err) {
      console.error('Dashboard error:', err);
      loading.setAttribute('role', 'alert');
      loading.innerHTML =
        `<p class="text-grit-accent p-8 text-center">Error loading dashboard: ${err.message}</p>`;
    }
  }

  loadDashboard();
</script>
{{ end }}
