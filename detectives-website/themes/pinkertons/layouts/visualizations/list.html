{{ define "main" }}
<section class="py-16 px-6">
  <div class="container mx-auto">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-4xl md:text-5xl font-heading font-bold text-grit-text-dark mb-4">{{ .Title }}</h1>
      <div class="text-xl text-grit-text-dark/80 mb-12 prose prose-lg max-w-none">{{ .Content }}</div>

      <!-- Visualizations Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {{ range .Pages.ByWeight }}
          {{ if not .Params.hidden }}
        <a href="{{ .Permalink }}" class="bg-white border border-gray-200 rounded-lg overflow-hidden hover:border-grit-steel transition-colors shadow-sm group">
          <!-- Thumbnail -->
          {{ $thumb := .Params.thumbnail | default "/images/viz-thumbnails/placeholder.svg" }}
          <div class="aspect-[2/1] bg-grit-bg overflow-hidden">
            <img src="{{ $thumb }}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
          </div>
          <!-- Content -->
          <div class="p-5">
            <h3 class="text-lg font-heading font-semibold text-grit-text-dark mb-2 group-hover:text-grit-accent transition-colors">
              {{ .Title }}
            </h3>
            <p class="text-sm text-grit-text-dark/80 leading-relaxed">
              {{ .Params.description }}
            </p>
            <div class="mt-3 flex items-center text-grit-steel text-sm font-medium">
              View Analysis
              <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </div>
        </a>
          {{ end }}
        {{ end }}
      </div>

    </div>
  </div>
</section>
{{ end }}
